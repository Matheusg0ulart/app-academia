name: Build & Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Recreate Android Scaffold & Configure SDK
        working-directory: fitlife-ai/frontend
        run: |
          flutter create . --platforms=android --org=com.fitlife --project-name=fitlife_ai
          
          python3 -c "
          import os, glob
          for p in glob.glob('android/**/*.gradle*', recursive=True):
              try:
                  with open(p, 'r') as f:
                      c = f.read()
                  c = c.replace('flutter.minSdkVersion', '21')
                  c = c.replace('flutter.compileSdkVersion', '34')
                  c = c.replace('minSdk = flutter.minSdkVersion', 'minSdk = 21')
                  c = c.replace('minSdkVersion flutter.minSdkVersion', 'minSdkVersion 21')
                  c = c.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 34')
                  c = c.replace('compileSdkVersion flutter.compileSdkVersion', 'compileSdkVersion 34')
                  with open(p, 'w') as f:
                      f.write(c)
                  print(f'Patched {p}')
              except Exception as e:
                  print(f'Error patching {p}: {e}')
          "

      - name: Configure Android Manifest Permissions
        working-directory: fitlife-ai/frontend
        run: |
          python3 -c "
          import os
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          if os.path.exists(manifest_path):
              with open(manifest_path, 'r') as f:
                  m = f.read()
              perms = '''
    <uses-permission android:name=\"android.permission.INTERNET\"/>
    <uses-permission android:name=\"android.permission.CAMERA\"/>
    <uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\"/>
    <uses-permission android:name=\"android.permission.WRITE_EXTERNAL_STORAGE\"/>
'''
              if '<uses-permission' not in m:
                  m = m.replace('<application', perms + '    <application')
                  with open(manifest_path, 'w') as f:
                      f.write(m)
                  print('Permissions added to AndroidManifest.xml')
          "

      - name: Get Dependencies
        working-directory: fitlife-ai/frontend
        run: flutter pub get

      - name: Build Android APK Release
        working-directory: fitlife-ai/frontend
        run: flutter build apk --release --no-tree-shake-icons

      - name: Prepare APK Release Artifacts
        run: |
          cp fitlife-ai/frontend/build/app/outputs/flutter-apk/app-release.apk ./fitlife-ai.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fitlife-ai-apk
          path: fitlife-ai.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          files: |
            ./fitlife-ai.apk
            fitlife-ai/frontend/build/app/outputs/flutter-apk/app-release.apk
          name: FitLife AI ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          draft: false
          prerelease: false
          make_latest: true
          body: |
            ## 🏋️‍♂️ FitLife AI — Versão Oficial Android
            
            Baixe o arquivo **`fitlife-ai.apk`** abaixo para instalar diretamente no seu celular Android.
            
            ### ✨ Recursos em Destaque:
            - 📸 **Scanner de Prato com Google Gemini Vision:** Reconhecimento automático e cálculo de macronutrientes
            - 🥗 **Base TACO + Open Food Facts:** Busca textual e leitor de código de barras
            - ⏱️ **Cronômetro HIIT & Tabata:** Temporizador esportivo inteligente
            - 🏆 **Gamificação & Conquistas:** Sistema de Níveis, XP e Medalhas
            - 📊 **Gráficos de Evolução:** Curvas de peso e histórico corporal
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
