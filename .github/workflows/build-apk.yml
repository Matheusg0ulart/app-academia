name: Build & Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Scaffold Android
        working-directory: fitlife-ai/frontend
        run: |
          flutter create . --platforms=android --org=com.fitlife --project-name=fitlife_ai

      - name: Get Dependencies
        working-directory: fitlife-ai/frontend
        run: flutter pub get

      - name: Build Android APK Release
        working-directory: fitlife-ai/frontend
        run: flutter build apk --release --no-tree-shake-icons

      - name: Prepare APK File
        run: |
          cp fitlife-ai/frontend/build/app/outputs/flutter-apk/app-release.apk ./fitlife-ai.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fitlife-ai-apk
          path: fitlife-ai.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }}
          files: |
            ./fitlife-ai.apk
            fitlife-ai/frontend/build/app/outputs/flutter-apk/app-release.apk
          name: FitLife AI ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }}
          draft: false
          prerelease: false
          make_latest: true
          body: |
            ## 🏋️‍♂️ FitLife AI — Versão Oficial Android
            
            Baixe o arquivo **`fitlife-ai.apk`** abaixo para instalar diretamente no seu celular Android.
            
            ### ✨ Recursos em Destaque:
            - 📸 **Scanner de Prato com Google Gemini Vision:** Reconhecimento automático e cálculo de macronutrientes
            - 🥗 **Base TACO + Open Food Facts:** Busca textual e leitor de código de barras
            - ⏱️ **Cronômetro HIIT & Tabata:** Temporizador esportivo inteligente
            - 🏆 **Gamificação & Conquistas:** Sistema de Níveis, XP e Medalhas
            - 📊 **Gráficos de Evolução:** Curvas de peso e histórico corporal
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
