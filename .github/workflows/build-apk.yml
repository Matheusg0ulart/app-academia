name: Build & Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Recreate Android Project Scaffold
        working-directory: fitlife-ai/frontend
        run: |
          flutter create . --platforms=android --project-name=fitlife_ai

      - name: Get Flutter Dependencies
        working-directory: fitlife-ai/frontend
        run: flutter pub get

      - name: Build Android APK Release
        working-directory: fitlife-ai/frontend
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fitlife-ai-apk
          path: fitlife-ai/frontend/build/app/outputs/flutter-apk/app-release.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: fitlife-ai/frontend/build/app/outputs/flutter-apk/app-release.apk
          name: FitLife AI ${{ github.ref_name }}
          body: |
            ## 🏋️‍♂️ FitLife AI — Versão Oficial Android
            
            Baixe o arquivo **`app-release.apk`** abaixo para instalar no seu celular.
            
            ### ✨ Novidades:
            - 📸 Scanner de Prato com Google Gemini Vision AI
            - 🥗 Tabela TACO + Open Food Facts com Barcode
            - ⏱️ Cronômetro HIIT, Tabata e EMOM
            - 🏆 Gamificação, Níveis e Conquistas
            - 📊 Gráficos de Evolução e Calculadora de Anilhas
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
